services:
  - type: web
    name: nepal-aq-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn nepal_aq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: worker
    name: nepal-aq-celery
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A nepal_aq worker -l info -Q default,ingestion
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: nepal-aq-dashboard
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: nepal-aq-redis
          property: connectionString

databases:
  - name: nepal-aq-db
    plan: free
    databaseName: nepal_aq_db
    user: aq_user

  - type: redis
    name: nepal-aq-redis
    plan: free
