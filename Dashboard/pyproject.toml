[project]
name = "nepal-aq-dashboard"
version = "0.1.0"
description = "Nepal Air Quality Dashboard — Django + Wagtail"
requires-python = ">=3.11"
dependencies = [
  "Django==4.2.16",
  "wagtail>=6.0,<7.0",
  "djangorestframework>=3.15",
  "django-filter>=24.0",
  "django-environ>=0.11",
  "django-cors-headers>=4.3",
  "whitenoise>=6.6",
  "celery>=5.3",
  "redis>=5.0",
  "django-celery-beat>=2.6",
  "django-celery-results>=2.5",
  "psycopg2-binary>=2.9",
  "pandas>=2.0",
  "numpy>=1.24",
  "pytz>=2024.1",
  "Pillow>=10.0",
  "python-dateutil>=2.8",
  "gunicorn>=26.0.0",
  "djangorestframework-simplejwt>=5.5.1",
]

[project.optional-dependencies]
dev = [
  "factory-boy",
  "faker",
  "flake8",
]

[dependency-groups]
dev = [
  "factory-boy",
  "faker",
  "flake8",
]

[tool.hatch.build.targets.wheel]
packages = ["nepal_aq", "apps", "cms", "dummy_data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
