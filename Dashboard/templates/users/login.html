{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Nepal Air Observatory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center">
  <div class="max-w-md w-full mx-auto px-6">
    <div class="text-center mb-8">
      <div class="inline-flex items-center space-x-2 mb-4">
        <span class="block h-1.5 w-6 bg-red-600 rounded-full"></span>
        <span class="block h-1.5 w-6 bg-blue-800 rounded-full"></span>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Nepal Air Observatory</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in to access the research portal</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 px-8 py-8">
      {% if form.errors %}
        <div class="mb-4 rounded-md bg-red-50 border border-red-100 px-4 py-3 text-sm text-red-700">
          Invalid username or password.
        </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.GET.next }}" />

        <div class="space-y-4">
          <div>
            <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" id="id_username"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                   autocomplete="username" autofocus />
          </div>
          <div>
            <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" id="id_password"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                   autocomplete="current-password" />
          </div>
        </div>

        <button type="submit"
                class="mt-6 w-full bg-blue-800 text-white text-sm font-semibold py-2.5 rounded-lg hover:bg-blue-900 transition-colors">
          Sign in
        </button>
      </form>

      <div class="mt-6 border-t border-gray-100 pt-4 text-xs text-gray-400 text-center">
        <p>Public users can <a href="/" class="text-blue-700 hover:underline">explore the observatory</a> without signing in.</p>
      </div>
    </div>

    <!-- Dev credentials hint -->
    <!-- <div class="mt-4 bg-yellow-50 border border-yellow-100 rounded-xl px-4 py-3 text-xs text-yellow-700">
      <strong>Dev credentials:</strong>
      admin / admin &nbsp;&bull;&nbsp; researcher / research123 &nbsp;&bull;&nbsp; maintainer / maintain123
    </div> -->
  </div>
</body>
</html>
