version: "3.9"

# Full local dev stack — mirrors the production Render architecture:
#
#   db            → Postgres (same engine as prod)
#   web           → Django runserver (auto-migrates, creates admin + sensors)
#   worker        → process_ingestion_jobs loop (simulates Render Cron 1)
#   aggregator    → aggregate_readings loop      (simulates Render Cron 2)
#   emulator-*    → synthetic sensors sending live API readings
#
# Usage:
#   docker compose up                 — start everything, tail all logs
#   docker compose up -d              — start in background
#   docker compose logs -f web        — follow web logs only
#   docker compose logs -f emulator-outdoor
#   docker compose down               — stop, keep data volume
#   docker compose down -v            — stop + wipe DB (clean slate)
#
# Web:      http://localhost:8000        (admin / admin)
# Admin:    http://localhost:8000/admin
# API docs: http://localhost:8000/data/

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: nepal_aq.settings.development
  DATABASE_URL: postgres://aq_user:aq_password@db:5432/nepal_aq_db
  DJANGO_SECRET_KEY: dev-only-insecure-key-do-not-use-in-production
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"

services:

  # ── Postgres ──────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nepal_aq_db
      POSTGRES_USER: aq_user
      POSTGRES_PASSWORD: aq_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aq_user -d nepal_aq_db"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── Django web server ─────────────────────────────────────────────────────────
  web:
    build: .
    entrypoint: ["/bin/bash", "/app/docker/web_entrypoint.sh"]
    volumes:
      - .:/app                          # live code reload
      - dev_keys:/shared                # API keys shared with emulators
      - media_files:/app/mediafiles     # uploaded CSVs (local dev path)
    ports:
      - "8000:8000"
    environment:
      <<: *django-env
    depends_on:
      db:
        condition: service_healthy

  # ── Ingestion worker (simulates Render Cron 1: process_ingestion_jobs) ─────────
  worker:
    build: .
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[worker] Waiting for web..."
        until python -c "
        import urllib.request, sys
        try: urllib.request.urlopen('http://web:8000/', timeout=3); sys.exit(0)
        except: sys.exit(1)" 2>/dev/null; do sleep 5; done
        echo "[worker] Starting process_ingestion_jobs loop (every 30s)..."
        while true; do
          python manage.py process_ingestion_jobs --max-jobs 10
          sleep 30
        done
    volumes:
      - .:/app
      - media_files:/app/mediafiles
    environment:
      <<: *django-env
    depends_on:
      - web

  # ── Aggregation worker (simulates Render Cron 2: aggregate_readings) ──────────
  aggregator:
    build: .
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "[aggregator] Waiting for web..."
        until python -c "
        import urllib.request, sys
        try: urllib.request.urlopen('http://web:8000/', timeout=3); sys.exit(0)
        except: sys.exit(1)" 2>/dev/null; do sleep 5; done
        echo "[aggregator] Starting aggregate_readings loop (every 2 min)..."
        while true; do
          python manage.py aggregate_readings
          sleep 120
        done
    volumes:
      - .:/app
    environment:
      <<: *django-env
    depends_on:
      - web

  # ── Outdoor sensor emulator ───────────────────────────────────────────────────
  emulator-outdoor:
    build: .
    entrypoint: ["/bin/bash", "/app/docker/emulator_entrypoint.sh"]
    volumes:
      - .:/app
      - dev_keys:/shared
    environment:
      <<: *django-env
      SENSOR_TYPE: outdoor
      INTERVAL: "10"           # send a reading every 10 seconds for fast local testing
      BATCH_ON_START: "1"      # push 24h of historical data first, then go live
    depends_on:
      - web

  # ── Indoor sensor emulator ────────────────────────────────────────────────────
  emulator-indoor:
    build: .
    entrypoint: ["/bin/bash", "/app/docker/emulator_entrypoint.sh"]
    volumes:
      - .:/app
      - dev_keys:/shared
    environment:
      <<: *django-env
      SENSOR_TYPE: indoor
      INTERVAL: "10"
      BATCH_ON_START: "1"
    depends_on:
      - web

volumes:
  postgres_data:
  dev_keys:
  media_files:
