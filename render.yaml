services:
  # ── Web service ─────────────────────────────────────────────────────────────
  - type: web
    name: nepal-aq-dashboard
    runtime: python
    plan: free

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py shell -c "import os; from django.contrib.auth import get_user_model; User=get_user_model(); username=os.environ.get('DJANGO_SUPERUSER_USERNAME'); email=os.environ.get('DJANGO_SUPERUSER_EMAIL'); password=os.environ.get('DJANGO_SUPERUSER_PASSWORD'); User.objects.filter(username=username).exists() or User.objects.create_superuser(username=username, email=email, password=password)"
      if [ "$RESET_DATA" = "true" ]; then python manage.py clear_data --yes; fi

    startCommand: |
      cd Dashboard
      gunicorn nepal_aq.wsgi:application --bind 0.0.0.0:$PORT --timeout 300

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: nepal-aq
      - key: ARCHIVE_AFTER_DAYS
        value: "90"
      # Set these manually in the Render dashboard — never commit real passwords
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # ── Storage settings (AQ_INGESTION) ─────────────────────────────────────
      # AQ_DB_RAW_ENABLED=false  → raw minute readings go to R2 parquet only.
      #                             DB holds aggregates + live buffer only.
      - key: AQ_DB_RAW_ENABLED
        value: "false"
      # AQ_DB_RAW_RECENT_DAYS=7  → keep last 7 days of live API readings in DB
      #                             so the dashboard chart's "raw" zoom and the
      #                             GET /api/v1/readings/ endpoint work for recent data.
      #                             Historical data lives in R2 parquet only.
      #                             Set to 0 to disable (aggregates-only DB).
      - key: AQ_DB_RAW_RECENT_DAYS
        value: "7"
      # Which aggregate levels to keep in DB.  Remove "tenmin" to save ~30% more space.
      - key: AQ_DB_AGGREGATES
        value: "tenmin,hourly,daily"
      # R2 parquet partition granularity: month | week | day
      - key: AQ_R2_PARTITION_BY
        value: "month"

  # ── Cron 1: process queued CSV uploads (every minute) ──────────────────────
  - type: cron
    name: nepal-aq-process-uploads
    runtime: python
    plan: starter
    schedule: "* * * * *"

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt

    startCommand: |
      cd Dashboard
      python manage.py process_ingestion_jobs --max-jobs 10

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          name: nepal-aq-dashboard
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: nepal-aq

  # ── Cron 2: aggregate raw readings (every 10 minutes) ──────────────────────
  - type: cron
    name: nepal-aq-aggregate
    runtime: python
    plan: starter
    schedule: "*/10 * * * *"

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt

    startCommand: |
      cd Dashboard
      python manage.py aggregate_readings

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          name: nepal-aq-dashboard
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"

  # ── Cron 3: daily Postgres backup to R2 (02:00 UTC) ──────────────────────────
  # Backs up the Postgres schema + aggregate tables.  Raw readings live in R2
  # parquet (processed/<serial>/YYYY/MM/readings.parquet) and don't need backing up.
  - type: cron
    name: nepal-aq-backup
    runtime: python
    plan: starter
    schedule: "0 2 * * *"

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt

    startCommand: |
      cd Dashboard
      python manage.py backup_db_to_r2

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          name: nepal-aq-dashboard
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: nepal-aq

databases:
  - name: nepal-aq-db
    plan: free
    databaseName: nepal_aq_db
    user: aq_user
