services:
  - type: web
    name: nepal-aq-dashboard
    runtime: python
    plan: free

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py shell -c "import os; from django.contrib.auth import get_user_model; User=get_user_model(); username=os.environ.get('DJANGO_SUPERUSER_USERNAME'); email=os.environ.get('DJANGO_SUPERUSER_EMAIL'); password=os.environ.get('DJANGO_SUPERUSER_PASSWORD'); User.objects.filter(username=username).exists() or User.objects.create_superuser(username=username, email=email, password=password)"
      if [ "$RESET_DATA" = "true" ]; then python manage.py clear_data --yes; fi
      python manage.py load_real_data

    startCommand: |
      cd Dashboard
      gunicorn nepal_aq.wsgi:application --bind 0.0.0.0:$PORT --timeout 300

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: cron
    name: nepal-aq-ingestion-worker
    runtime: python
    plan: free
    schedule: "* * * * *"   # every minute

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt

    startCommand: |
      cd Dashboard
      python manage.py process_ingestion_jobs --max-jobs 10

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production

      - key: DJANGO_SECRET_KEY
        fromService:
          name: nepal-aq-dashboard
          type: web
          envVarKey: DJANGO_SECRET_KEY

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: nepal-aq-db
    plan: free
    databaseName: nepal_aq_db
    user: aq_user