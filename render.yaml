services:
  - type: web
    name: nepal-aq-dashboard
    runtime: python
    plan: free

    buildCommand: |
      cd Dashboard
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
      python manage.py load_real_data

    startCommand: |
      cd Dashboard
      gunicorn nepal_aq.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: nepal_aq.settings.production

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com

      - key: DATABASE_URL
        fromDatabase:
          name: nepal-aq-db
          property: connectionString

      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: nepal-aq-db
    plan: free
    databaseName: nepal_aq_db
    user: aq_user